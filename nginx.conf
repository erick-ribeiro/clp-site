server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  error_page 404 =404 /404.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
  }

  location /downloads/ {
    try_files $uri =404;
    add_header Content-Disposition "attachment";
  }

  location ~* \.(css|js|svg|png|ico|woff2?)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
  }
}
